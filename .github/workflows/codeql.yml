name: CodeQL

# GitHub's code scanning for the Kotlin and Java code. Results go to the repo's Security tab;
# it never blocks a build or a release.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      - uses: github/codeql-action/init@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual

      # A debug build without secrets, so the Kotlin code is compiled and analysed. CI and GITHUB_ACTIONS
      # are unset for Gradle only: on CI the build refuses to configure without the release key.
      - name: Build
        run: |
          chmod +x gradlew
          env -u CI -u GITHUB_ACTIONS ./gradlew --no-daemon --no-build-cache assembleDebug

      - uses: github/codeql-action/analyze@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          category: "/language:java-kotlin"
